name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Prepare data
        run: python scripts/prepare_data.py

      - name: Train
        run: python -m src.train

      - name: Test
        run: pytest -v

      - name: Docker build
        run: docker build -t taxi-duration:latest .
